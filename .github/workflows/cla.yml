# Asks first-time contributors to sign CLA.md on their pull request, and keeps
# the check red until they do. Signatures are stored in signatures/version1/cla.json.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# pull_request_target runs the workflow from the base branch with write access;
# it never checks out or runs code from the pull request.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # contributor-assistant/github-action v2.6.1, pinned to its commit
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/SkidGod4444/codemax-cli/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: main
          allowlist: SkidGod4444,dependabot[bot],renovate[bot],github-actions[bot]
