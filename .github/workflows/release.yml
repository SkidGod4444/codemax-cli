# Builds the standalone codemax binaries for a tagged release and attaches them to it, with checksums.
# EditMax's updater downloads `codemax-darwin-<arch>` from the latest release; `codemax update` can too.
#   git tag v0.1.22 && git push origin v0.1.22   -> this workflow builds and uploads the assets
name: release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)build assets for, e.g. v0.1.22"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS binaries are built and ad-hoc signed on macOS: an unsigned arm64 binary is killed at launch.
          - os: macos-latest
            targets: "bun-darwin-arm64 bun-darwin-x64"
          - os: ubuntu-latest
            targets: "bun-linux-x64 bun-linux-arm64 bun-windows-x64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: The tag matches package.json
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          v="$(node -p "require('./package.json').version")"
          [ "$tag" = "v$v" ] || { echo "tag $tag but package.json says $v"; exit 1; }
      - name: Build
        run: |
          mkdir -p out
          for t in ${{ matrix.targets }}; do
            name="codemax-${t#bun-}"
            [ "${t#bun-windows}" != "$t" ] && name="$name.exe"
            bun build --compile --minify --target="$t" src/cli.ts --outfile "out/$name"
            if [ "$RUNNER_OS" = "macOS" ]; then codesign --force --sign - "out/$name"; fi
            (cd out && shasum -a 256 "$name" > "$name.sha256")
          done
          ls -l out
      - name: The binary for this runner runs
        run: |
          case "$RUNNER_OS" in
            macOS) bin=out/codemax-darwin-arm64;;
            *) bin=out/codemax-linux-x64;;
          esac
          "$bin" --version
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          gh release upload "$tag" assets/* --repo "$GITHUB_REPOSITORY" --clobber
