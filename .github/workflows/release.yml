# Builds the standalone codemax binaries for a tagged release and attaches them to it, with checksums.
# EditMax's updater downloads `codemax-darwin-<arch>` from the latest release; `codemax update` can too.
#   git tag v0.1.22 && git push origin v0.1.22   -> this workflow builds and uploads the assets
name: release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)build assets for, e.g. v0.1.22"
        required: true

permissions:
  contents: write

jobs:
  build:
    # One native runner per binary: bun can only compile for the platform whose @opentui/core
    # native package is installed, and macOS binaries must be ad-hoc signed on macOS.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: codemax-darwin-arm64
          - os: macos-15-intel
            name: codemax-darwin-x64
          - os: ubuntu-latest
            name: codemax-linux-x64
          - os: ubuntu-24.04-arm
            name: codemax-linux-arm64
          - os: windows-latest
            name: codemax-windows-x64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: The tag matches package.json
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          v="$(node -p "require('./package.json').version")"
          [ "$tag" = "v$v" ] || { echo "tag $tag but package.json says $v"; exit 1; }
      - name: Build
        run: |
          mkdir -p out
          bun build --compile --minify src/cli.ts --outfile "out/${{ matrix.name }}"
          if [ "$RUNNER_OS" = "macOS" ]; then codesign --force --sign - "out/${{ matrix.name }}"; fi
          cd out
          if command -v sha256sum >/dev/null; then sha256sum "${{ matrix.name }}" > "${{ matrix.name }}.sha256"; else shasum -a 256 "${{ matrix.name }}" > "${{ matrix.name }}.sha256"; fi
          ls -l
      - name: The binary runs
        run: out/${{ matrix.name }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          gh release upload "$tag" assets/* --repo "$GITHUB_REPOSITORY" --clobber
